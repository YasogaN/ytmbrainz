services:
  ytmbrainz:
    build: .
    image: ghcr.io/yasogan/ytmbrainz:latest
    # No host ports are published by default; reach the service over the
    # container network (e.g. another container, a reverse proxy, or a tunnel
    # on the same network). Uncomment to expose /ws/2 on the host:
    # ports:
    #   - '3000:3000'
    environment:
      YTMB_HOST: 0.0.0.0
      YTMB_PORT: 3000
      YTMB_CACHE_TTL: '3600'
      YTMB_YT_RATE_LIMIT_MS: '1000'
      YTMB_DB_PATH: /app/data/ytmbrainz.db
    volumes:
      - ytmbrainz-data:/app/data
    restart: unless-stopped

  # Optional: MITM coverartarchive.org into ytmbrainz's CAA routes for clients
  # that hardcode the real Cover Art Archive. See docs/caa.md for the full
  # setup (shared external network + alias wiring).
  # caa-mitm:
  #   image: mitmproxy/mitmproxy
  #   networks:
  #     caa:
  #       aliases: [coverartarchive.org]
  #   command: ["mitmdump", "--mode", "reverse:http://ytmbrainz:3000@443", "--set", "keep_host_header=true"]
  #   volumes:
  #     - mitm-ca:/home/mitmproxy/.mitmproxy
  #   restart: unless-stopped

volumes:
  ytmbrainz-data:

