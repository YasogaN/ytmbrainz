name: Live tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

jobs:
  live:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run live tests against YouTube
        env:
          YTMB_VISITOR_DATA: ${{ secrets.YTMB_VISITOR_DATA }}
          YTMB_COOKIE: ${{ secrets.YTMB_COOKIE }}
          YTMB_PO_TOKEN: ${{ secrets.YTMB_PO_TOKEN }}
        run: bun test:live
