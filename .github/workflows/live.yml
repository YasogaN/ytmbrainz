name: Live tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

jobs:
  live:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run live tests against YouTube
        run: RUN_LIVE=1 bun test tests/live
