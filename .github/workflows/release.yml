name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build and push. Defaults to the current ref name."
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-version:
    name: Bump package.json to tag version
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        id: resolve
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Ref '$GITHUB_REF_NAME' is not a vX.Y.Z tag."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether package.json is already in sync
        id: check
        run: |
          CURRENT="$(node -p "require('./package.json').version")"
          if [ "$CURRENT" = "${{ steps.resolve.outputs.version }}" ]; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump package.json version
        if: steps.check.outputs.bumped == 'true'
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ steps.resolve.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Commit and push the version bump
        if: steps.check.outputs.bumped == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump version to ${{ steps.resolve.outputs.version }}"
          git push origin HEAD:main

      - name: Move the tag onto the bumped commit
        if: steps.check.outputs.bumped == 'true'
        run: |
          git tag -f "$GITHUB_REF_NAME"
          git push --force origin "$GITHUB_REF_NAME"

  release:
    name: Build and publish
    needs: update-version
    if: ${{ !cancelled() && (needs.update-version.result == 'success' || needs.update-version.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      INPUT_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch latest refs and tags
        run: git fetch origin --force --tags

      - name: Checkout the tag ref for the build
        if: startsWith(github.ref, 'refs/tags/')
        run: git checkout --detach "refs/tags/${GITHUB_REF_NAME}"

      - name: Derive image and tag
        id: tag
        run: |
          # GHCR names must be lowercase; ${VAR,,} lowercases the repo ref.
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${INPUT_TAG:-$GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.tag }}
            ${{ steps.tag.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          name: ${{ steps.tag.outputs.tag }}
