pre-commit:
  parallel: true
  commands:
    biome:
      glob: '*.{ts,tsx,js,cjs,mjs,json,md,yml,yaml}'
      run: bunx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    typecheck:
      run: bun run typecheck
    test:
      run: bun test
